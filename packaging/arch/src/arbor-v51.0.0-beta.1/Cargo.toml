[package]
name = "arbor"
version = "51.0.0-beta.1"
edition = "2024"
license = "MIT"
description = "Arbor — see where your disk space grows. A Linux disk usage analyzer."
authors = ["hakergeniusz"]
repository = "https://github.com/hakergeniusz/arbor"
publish = false

[lib]
name = "arbor"
path = "src/lib.rs"

[[bin]]
name = "arbor"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8", "gtk_v4_10"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[build-dependencies]
glib-build-tools = "0.22"
